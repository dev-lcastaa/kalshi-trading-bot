services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kalshi
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalshi -d kalshi"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # The bot is private to the Compose network; the frontend is the public edge.
      DATABASE_URL: postgresql://kalshi:kalshi@postgres:5432/kalshi
      KALSHI_DASHBOARD_HOST: 0.0.0.0
    expose:
      - "8000"
    volumes:
      - ./.secrets:/app/.secrets:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "8000:80"

volumes:
  postgres-data:
